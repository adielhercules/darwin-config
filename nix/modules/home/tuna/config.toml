[hotkeys]
custom = []

    [hotkeys.app.activate]
    carbonKeyCode = 49
    carbonModifiers = 256

    [hotkeys.app.comboMode]
    carbonKeyCode = 15
    carbonModifiers = 2048

    [hotkeys.app.dictation]
    carbonKeyCode = 5
    carbonModifiers = 6912

    [hotkeys.app.textMode]
    carbonKeyCode = 9
    carbonModifiers = 6912

[settings]
backspaceBehavior = 'deleteCharacters'
clipboardHistoryEnabled = false
comboModeBackspaceBehavior = 'stepBack'
comboModeCheatsheetDelayMS = 1000
dictationActivationMode = 'toggle'
dictationWindowPosition = 'topCenter'
shelfCatalogEnabled = false
talkModeDoublePressTrigger = 'rightCommand'
talkModeModifierTrigger = 'hyper'
themeIdentifier = 'com.brnbw.tuna.themes.Notch'

[[catalogSettings]]
catalogIdentifier = 'tuna.prompts'

    [catalogSettings.values]
    Provider = 'apple'

[[catalogSettings]]
catalogIdentifier = 'tuna.text-actions'

    [catalogSettings.values]
    TextActionsFileExtension = 'txt'
