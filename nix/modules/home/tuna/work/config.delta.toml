# This file contains only the WORK-profile-specific additions layered on
# top of ../config.shared.toml by ../default.nix's `applyPatches` merge.
#
# Format: each block below is a `# @patch:append <path>` / `# @end` pair.
# `<path>` is either the literal dotted path `catalogs.globalScopes` (a
# top-level array not keyed by `key`), or a `/`-separated chain of `key`
# field values, resolved by walking `comboMode.bindings` (the top-level
# array) and then `.destination.bindings` / `.destination.bindings.destination.bindings` / etc for nested
# paths, matching each path segment against a sibling's `key` field.
#
# LIMITATION: only tail-append is currently supported — every block's
# entries are spliced in as the LAST item(s) of the target array, never at
# an arbitrary position within it. Where these work-only entries originally
# sat in the middle of the array (teams/outlook/dia between "edge" and
# "zed" in the Open group; "Focus (work)" between "misc" and "Focus window"
# in the Aerospace group), they will now appear at the end of their
# respective array instead. This is an accepted, documented cosmetic
# reordering — there is no replace/remove/insert-after support yet.

# @patch:append catalogs.globalScopes
    [[catalogs.globalScopes]]
    catalogIdentifier = 'tuna.applications'

        [catalogs.globalScopes.scope]
        itemIDs = [ '/Applications/Zscaler/RevertZcc/Zscaler-osx-4.5.2.105-installer.app' ]
        kind = 'excluding'
# @end

# @patch:append o
    [[comboMode.bindings.destination.bindings]]
    iconPath = '/Applications/Microsoft Teams.app'
    key = 't'
    label = 'teams'

        [comboMode.bindings.destination.bindings.destination]
        type = 'command'

            [comboMode.bindings.destination.bindings.destination.command]
            actionIdentifier = 'tuna.common-actions/open'
            behavior = 'run'
            presentation = 'automatic'
            subjectIdentifiers = [ 'path:/Applications/Microsoft Teams.app' ]
            type = 'savedCommand'

    [[comboMode.bindings.destination.bindings]]
    iconPath = '/Applications/Microsoft Outlook.app'
    key = 'o'
    label = 'outlook'

        [comboMode.bindings.destination.bindings.destination]
        type = 'command'

            [comboMode.bindings.destination.bindings.destination.command]
            actionIdentifier = 'tuna.common-actions/open'
            behavior = 'run'
            presentation = 'automatic'
            subjectIdentifiers = [ 'path:/Applications/Microsoft Outlook.app' ]
            type = 'savedCommand'

    [[comboMode.bindings.destination.bindings]]
    iconPath = '/Applications/Dia.app'
    key = 'd'
    label = 'dia'

        [comboMode.bindings.destination.bindings.destination]
        type = 'command'

            [comboMode.bindings.destination.bindings.destination.command]
            actionIdentifier = 'tuna.common-actions/open'
            behavior = 'run'
            presentation = 'automatic'
            subjectIdentifiers = [ 'path:/Applications/Dia.app' ]
            type = 'savedCommand'
# @end

