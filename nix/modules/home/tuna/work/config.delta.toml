# @patch:append a
    [[comboMode.bindings.destination.bindings]]
    key = 'k'
    label = 'Focus (work)'

        [comboMode.bindings.destination.bindings.destination]
        type = 'command'

            [comboMode.bindings.destination.bindings.destination.command]
            actionIdentifier = 'tuna.common-actions/run-text-as-shell-command'
            behavior = 'run'
            presentation = 'automatic'
            subjectIdentifiers = [ 'text:/etc/profiles/per-user/<user>/bin/aerospace workspace F' ]
            type = 'savedCommand'
# @end

# @patch:append a/s/w
            [[comboMode.bindings.destination.bindings.destination.bindings.destination.bindings]]
            key = 'K'
            label = 'Focus (work)'

                [comboMode.bindings.destination.bindings.destination.bindings.destination.bindings.destination]
                type = 'command'

                    [comboMode.bindings.destination.bindings.destination.bindings.destination.bindings.destination.command]
                    actionIdentifier = 'tuna.common-actions/run-text-as-shell-command'
                    behavior = 'run'
                    presentation = 'automatic'
                    subjectIdentifiers = [ 'text:/etc/profiles/per-user/<user>/bin/aerospace move-node-to-workspace F' ]
                    type = 'savedCommand'

            [[comboMode.bindings.destination.bindings.destination.bindings.destination.bindings]]
            key = 'k'
            label = 'Focus (work)'

                [comboMode.bindings.destination.bindings.destination.bindings.destination.bindings.destination]
                type = 'command'

                    [comboMode.bindings.destination.bindings.destination.bindings.destination.bindings.destination.command]
                    actionIdentifier = 'tuna.common-actions/run-text-as-shell-command'
                    behavior = 'run'
                    presentation = 'automatic'
                    subjectIdentifiers = [ 'text:/etc/profiles/per-user/<user>/bin/aerospace move-node-to-workspace F --focus-follows-window' ]
                    type = 'savedCommand'
# @end
